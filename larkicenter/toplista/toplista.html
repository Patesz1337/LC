<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Larkinor Toplista</title>
<style>
  body{
    font-family: Arial, sans-serif;
    background:#fff;
    color:#000;
    margin:0;
    padding:20px 16px 60px;
  }
  .wrap{max-width:700px;margin:0 auto;}
  h1{text-align:center;font-size:20px;margin:4px 0 2px;}
  .meta{text-align:center;font-size:12px;color:#555;margin:0 0 18px;}
  .meta b{color:#000;}

  .form-row{text-align:center;margin-bottom:6px;font-size:13px;}
  select{
    font-family:Arial, sans-serif;
    font-size:13px;
    padding:3px 6px;
    margin:0 4px 8px;
  }
  .search{
    font-family:Arial, sans-serif;
    font-size:13px;
    padding:4px 8px;
    margin:0 0 14px;
    width:220px;
    display:block;
    margin-left:auto;
    margin-right:auto;
  }

  h2{text-align:center;font-size:16px;margin:10px 0 2px;}
  .genmeta{text-align:center;font-size:12px;color:#555;margin:0 0 10px;}

  table.result{
    width:90%;
    margin:0 auto 18px;
    border-collapse:collapse;
    font-family:Arial, sans-serif;
    font-size:12px;
    color:#FFBE00;
  }
  table.result th{
    background:#993300;
    padding:3px 8px;
    text-align:right;
  }
  table.result td{
    background:#990033;
    padding:3px 8px;
    text-align:right;
    font-weight:bold;
  }
  table.result a:link, table.result a:visited, table.result a:active{
    color:#FFBE00;
    text-decoration:none;
    font-family:Verdana, Arial, Helvetica, sans-serif;
    font-size:11px;
  }
  table.result a:hover{color:#CD0000;}

  .count{text-align:center;font-size:12px;color:#666;margin:0 0 20px;}

</style>
</head>
<body>
<div class="wrap">
  <h1>Larkinor Toplista</h1>
  <p class="meta">Saját gyűjtés élő karakterlapokból — a hivatalos toplista nem frissül 2025 óta. <b id="db-szoveg"></b></p>
  <br>
    <div class="form-row">
    <a href="mailto:patesz1337@gmail.com"><b>Amennyiben nem találod a karaktered írj és beteszem :)</b><br></a>
  </div>
  <br>
  <div class="form-row">
    <b>Melyik toplista érdekel:</b><br>
    <select id="statvalaszto"></select>
    <select id="oldalvalaszto"></select>
  </div>

  <input class="search" id="search" type="text" placeholder="Név keresése…">

  <h2 id="cim-szoveg"></h2>
  <p class="genmeta" id="frissitve-label"></p>

  <table class="result">
    <thead><tr id="thead-row"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="count" id="count"></div>
</div>

<script>
// Toplista oszlopok: kulcs a data.json-beli mezőnév, label a megjelenő név
const OSZLOPOK = [
  { key:'szint',    label:'Tapasztalati szint' },
  { key:'ero',      label:'Erő' },
  { key:'iq',       label:'IQ' },
  { key:'ugyesseg', label:'Ügyesség' },
  { key:'kitartas', label:'Kitartás' },
  { key:'szerencse',label:'Szerencse' },
  { key:'gyorsasag',label:'Gyorsaság' },
  { key:'elet',     label:'Életpont' },
  { key:'varazs',   label:'Varázspont' },
  { key:'bank',     label:'Pénz bankban' },
  { key:'piac',     label:'Pénz piacon' },
  { key:'katt',     label:'Klikkszám' },
  { key:'tpkatt',   label:'Tp/Katt' },
  { key:'fsza',     label:'Szúró-vágó fegyverszaki' },
  { key:'fszb',     label:'Ütő-zúzó fegyverszaki' },
  { key:'fszc',     label:'Távolsági fegyverszaki' },
  { key:'magia',    label:'Mágia' },
  { key:'rablas',   label:'Rablás' },
  { key:'lopas',    label:'Lopás' },
  { key:'zsebeles', label:'Zsebelés' },
  { key:'kuldi',    label:'Teljesített küldetés' },
  { key:'kovacs',   label:'Kovácsolás' },
  { key:'monszt',   label:'Monsztalogia' },
  { key:'hnp',      label:'Hírnév-pont' },
  { key:'irtas',    label:'Démonirtás' },
  { key:'toltes',   label:'Szigettöltés' },
  { key:'epitok',   label:'Legnagyobb építők' },
  { key:'hoditok',  label:'Legnagyobb hódítók' },
];
const OLDALMERET = 100;
const KARLAP_URL = 'https://l1.larkinor.hu/cgi-bin/larkinor?oldalTipus=otKarakterlap&melyik=';

// ---- ISO-8859-2 kódolás a karakterlap linkhez (a szerver ISO-8859-2-t vár, pl. ó = %F3) ----
const LATIN2_TABLA = {
  0xA1:'Ą',0xA2:'˘',0xA3:'Ł',0xA5:'Ľ',0xA6:'Ś',0xA9:'Š',0xAA:'Ş',0xAB:'Ť',0xAC:'Ź',0xAE:'Ž',0xAF:'Ż',
  0xB1:'ą',0xB2:'˛',0xB3:'ł',0xB5:'ľ',0xB6:'ś',0xB7:'ˇ',0xB9:'š',0xBA:'ş',0xBB:'ť',0xBC:'ź',0xBD:'˝',0xBE:'ž',0xBF:'ż',
  0xC0:'Ŕ',0xC1:'Á',0xC2:'Â',0xC3:'Ă',0xC4:'Ä',0xC5:'Ĺ',0xC6:'Ć',0xC7:'Ç',0xC8:'Č',0xC9:'É',0xCA:'Ę',0xCB:'Ë',0xCC:'Ě',0xCD:'Í',0xCE:'Î',0xCF:'Ď',
  0xD0:'Đ',0xD1:'Ń',0xD2:'Ň',0xD3:'Ó',0xD4:'Ô',0xD5:'Ő',0xD6:'Ö',0xD8:'Ř',0xD9:'Ů',0xDA:'Ú',0xDB:'Ű',0xDC:'Ü',0xDD:'Ý',0xDE:'Ţ',0xDF:'ß',
  0xE0:'ŕ',0xE1:'á',0xE2:'â',0xE3:'ă',0xE4:'ä',0xE5:'ĺ',0xE6:'ć',0xE7:'ç',0xE8:'č',0xE9:'é',0xEA:'ę',0xEB:'ë',0xEC:'ě',0xED:'í',0xEE:'î',0xEF:'ď',
  0xF0:'đ',0xF1:'ń',0xF2:'ň',0xF3:'ó',0xF4:'ô',0xF5:'ő',0xF6:'ö',0xF8:'ř',0xF9:'ů',0xFA:'ú',0xFB:'ű',0xFC:'ü',0xFD:'ý',0xFE:'ţ',0xFF:'˙',
};
const UNICODE_TO_LATIN2 = {};
for (const [b, ch] of Object.entries(LATIN2_TABLA)) UNICODE_TO_LATIN2[ch] = parseInt(b, 10);
function iso88592Encode(str){
  let out = '';
  for (const ch of str) {
    const cp = ch.codePointAt(0);
    if (cp < 0x80) out += encodeURIComponent(ch);
    else if (UNICODE_TO_LATIN2[ch] !== undefined) out += '%' + UNICODE_TO_LATIN2[ch].toString(16).toUpperCase().padStart(2,'0');
    else out += encodeURIComponent(ch);
  }
  return out;
}

let ADAT = [];
let aktivStat = 'szint'; // alapértelmezett: Tapasztalati szint
let aktivOldal = 0;
let searchTerm = '';

function fmt(n){ return n===null||n===undefined ? '—' : n.toLocaleString('hu-HU'); }

function renderStatValaszto(){
  const sel = document.getElementById('statvalaszto');
  sel.innerHTML = OSZLOPOK.map(c => `<option value="${c.key}"${c.key===aktivStat?' selected':''}>${c.label}</option>`).join('');
  sel.onchange = () => { aktivStat = sel.value; aktivOldal = 0; render(); };
}

function renderOldalValaszto(osszesDb){
  const sel = document.getElementById('oldalvalaszto');
  const oldalSzam = Math.max(1, Math.ceil(osszesDb / OLDALMERET));
  const opciok = [];
  for(let i=0;i<oldalSzam;i++){
    opciok.push(`<option value="${i}"${i===aktivOldal?' selected':''}>${i*OLDALMERET+1} - ${Math.min((i+1)*OLDALMERET, osszesDb)}</option>`);
  }
  sel.innerHTML = opciok.join('');
  sel.onchange = () => { aktivOldal = parseInt(sel.value, 10); render(); };
}

function renderThead(){
  const row = document.getElementById('thead-row');
  const label = OSZLOPOK.find(c=>c.key===aktivStat).label;
  row.innerHTML = `<th>Helyezés</th><th>Név</th><th>${label}</th><th>Tapasztalati szint</th>`;
}

function render(){
  renderStatValaszto();
  renderThead();

  let sorted = ADAT.filter(r => r[aktivStat] !== null && r[aktivStat] !== undefined);
  if(searchTerm){
    const s = searchTerm.toLowerCase();
    sorted = sorted.filter(r => r.nev.toLowerCase().includes(s));
  }
  sorted.sort((a,b) => b[aktivStat]-a[aktivStat]);

  renderOldalValaszto(sorted.length);
  const oldal = sorted.slice(aktivOldal*OLDALMERET, (aktivOldal+1)*OLDALMERET);

  const label = OSZLOPOK.find(c=>c.key===aktivStat).label;
  document.getElementById('cim-szoveg').textContent = label + ' toplista';

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = oldal.map((r,i) => `
    <tr>
      <td>${aktivOldal*OLDALMERET + i + 1}</td>
      <td><a href="${KARLAP_URL}${iso88592Encode(r.nev)}" target="_blank" rel="noopener">${r.nev}</a></td>
      <td>${fmt(r[aktivStat])}</td>
      <td>${fmt(r.szint)}</td>
    </tr>
  `).join('');

  document.getElementById('count').textContent = `${sorted.length} karakter ezen a listán`;
}

document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  aktivOldal = 0;
  render();
});

fetch('data.json')
  .then(r => r.json())
  .then(data => {
    ADAT = data;
    document.getElementById('db-szoveg').textContent = ADAT.length;
    document.getElementById('frissitve-label').textContent = 'Adat betöltve: data.json';
    render();
  })
  .catch(err => {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="4">Hiba: nem sikerült betölteni a data.json fájlt. Ellenőrizd, hogy ugyanabban a mappában van-e, mint ez a HTML.</td></tr>';
    console.error(err);
  });
</script>
</body>
</html>
